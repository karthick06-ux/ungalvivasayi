<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d2e">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>உங்கள் விவசாயி</title>
<style>html,body{margin:0;height:100%;background:#1f4d2e}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#inst{position:fixed;right:12px;top:12px;z-index:5;padding:10px 14px;border:0;border-radius:12px;background:#e8b923;color:#1c2a1d;font:800 14px system-ui,sans-serif}</style></head>
<body>
<iframe id="f" allow="geolocation" title="உங்கள் விவசாயி"></iframe>
<button id="inst" hidden>📲 ஆப்பை நிறுவு</button>
<script>
// இங்கே உங்கள் Apps Script Web app URL-ஐ ஒட்டுங்கள்
const APP_URL="https://script.google.com/macros/s/AKfycbzoTYZwRIVFc3N4YH8bh7LGeut9whg7IL2StszhlXah-1pWjDJ6-O20x0IftVZ2lYrh/exec";
document.getElementById("f").src=APP_URL;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
const btn=document.getElementById("inst");let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;btn.hidden=false});
btn.onclick=()=>{if(dp)dp.prompt();btn.hidden=true};
addEventListener("appinstalled",()=>{btn.hidden=true});
</script></body></html>
